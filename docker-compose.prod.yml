# Use with DigitalOcean Managed PostgreSQL (no local db container).
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d

services:
  db:
    profiles:
      - never

  migrate:
    depends_on: {}
    environment:
      DATABASE_URL: ${DATABASE_URL}

  backend:
    depends_on:
      migrate:
        condition: service_completed_successfully
